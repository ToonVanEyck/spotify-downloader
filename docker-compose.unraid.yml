services:
  spotdl-web:
    image: ghcr.io/toonvaneyck/spotify-downloader:latest
    container_name: spotdl-web
    command:
      - web
      - --host
      - 0.0.0.0
      - --port
      - "8800"
      - --web-use-output-dir
    ports:
      - "${SPOTDL_WEB_PORT:-8800}:8800"
    volumes:
      - "${SPOTDL_DOWNLOAD_DIR:-./downloads}:/music"
    environment:
      TZ: "${TZ:-UTC}"
    restart: unless-stopped
